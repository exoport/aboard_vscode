<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Nothing loads but the frame. `default-src 'none'` means no images, no
      fonts, no fetch; `frame-src` is exactly the board's own origins (loopback,
      plus whatever `asExternalUri` produced on a remote); the script is the
      inline bridge below and nothing else can run.
      Placeholders are substituted in src/panel.ts.
    -->
    <meta http-equiv="Content-Security-Policy" content="__CSP__" />
    <title>Aboard</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--vscode-editor-background);
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- `allow` delegates the clipboard-write permission down to the board, which
         is a cross-origin frame in here. The board's markup renderer copies a
         cropped region of an image as a PNG, and without this the browser
         refuses the write and the human gets a button that appears to do
         nothing — which is this extension's recurring failure mode, so the board
         reports the refusal in its own status line rather than swallowing it.
         Whether VS Code's own webview passes the permission down to a nested
         frame is not something a test here can answer; the board failing loudly
         is what makes that answerable by looking. -->
    <iframe id="frame" src="__SRC__" title="Aboard" allow="clipboard-write"></iframe>
    <script nonce="__NONCE__">
      const vscode = acquireVsCodeApi();
      const frame = document.getElementById('frame');
      // Every src this page will ever be handed is built by frameSrc() in
      // src/model.ts from the same board URL, so they all start with the one
      // the frame was rendered with. Checked rather than assumed: an html tab
      // inside the board is a sandboxed frame that can reach `window.top`, and
      // this branch is the only thing on the page that navigates anything. The
      // CSP already pins the ORIGIN; this pins the base path too, and the
      // invariant it relies on is asserted in test/model.test.ts.
      const ALLOWED = frame.getAttribute('src');

      // ---------------------------------------------------------- the theme
      //
      // This page is the ONLY place the editor's colours can be read. VS Code
      // puts the live theme on THIS document's root as `--vscode-*` custom
      // properties; the board's frame is cross-origin and inherits none of
      // them, and the extension host is given the theme's KIND and no values at
      // all. So the page reads them raw and posts them out; `src/theme.ts` maps
      // them onto the board's own 21 tokens; the mapping comes back here and is
      // posted into the frame as `{__aboard: 'theme'}`.
      //
      // No mapping lives here on purpose — this file stays a bridge. The list
      // of variable names is substituted by src/panel.ts from VSCODE_VARS, so
      // the names live beside the mapping that reads them.
      const VARS = __VARS__;
      let theme = null;
      let loaded = false;

      function report() {
        const style = getComputedStyle(document.documentElement);
        const vars = {};
        for (const name of VARS) {
          vars[name] = style.getPropertyValue(name);
        }
        vscode.postMessage({ type: 'theme', vars: vars, bodyClass: document.body.className });
      }

      function paint() {
        // Before the frame's first `load` there is no document in it to tell,
        // and a message posted at one is simply lost — so the last mapping is
        // held and posted then instead.
        if (!theme || !loaded || !frame.contentWindow) {
          return;
        }
        frame.contentWindow.postMessage({ __aboard: 'theme', kind: theme.kind, tokens: theme.tokens }, '*');
      }

      // Every load, not just the first: the board reloads itself when its own
      // code changes, and a reloaded document has none of the inline custom
      // properties the last message set. A `goto` is fragment-only and does NOT
      // reload, which is why `loaded` is never set back to false.
      frame.addEventListener('load', () => {
        loaded = true;
        paint();
      });

      // Switching between a light and a dark theme changes this class. Switching
      // between two dark themes does not — it changes the VALUES — which is why
      // the host also sends `theme-probe` on onDidChangeActiveColorTheme.
      new MutationObserver(report).observe(document.body, { attributes: true, attributeFilter: ['class'] });

      // And the values themselves, which VS Code writes as inline custom
      // properties on THIS root. Watching them is the only signal that needs no
      // round trip: `theme-probe` travels theme service -> extension host ->
      // renderer -> here, while the new properties travel theme service -> here,
      // and nothing orders the two. A probe that overtakes the properties reads
      // the OLD theme and the panel keeps the previous colours until something
      // unrelated moves. Cheap to be right about instead: one batched callback
      // per applyStyles, because the observer coalesces a whole synchronous run
      // of setProperty calls into a single delivery.
      new MutationObserver(report).observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });

      window.addEventListener('message', (e) => {
        if (e.source === frame.contentWindow) {
          // From the board. The frame is cross-origin by design, so the sender
          // is authenticated by SOURCE WINDOW, never by origin. The envelope key
          // is __aboard — the bridge was renamed outright, with no alias.
          if (e.data && e.data.__aboard === 'active' && typeof e.data.tab === 'string') {
            vscode.postMessage({ type: 'active', tab: e.data.tab });
          }
          return;
        }
        // From the extension host. `src` already carries the changing `r=` nonce
        // (built in src/model.ts, where it can be tested): the board does not
        // write the hash back when the human switches tabs inside it, so without
        // a changing value there is no hashchange and the click does nothing.
        if (e.data && e.data.type === 'goto' && typeof e.data.src === 'string' && e.data.src.indexOf(ALLOWED) === 0) {
          frame.src = e.data.src;
          return;
        }
        // The two theme branches are guarded, and `goto` deliberately is not.
        //
        // The board's `html` tabs are frames INSIDE the frame and can reach
        // `window.top`, which is this page: `e.source` is then neither the
        // board nor the host, so without a rule of their own these two would
        // take a message from an agent-authored widget, which could recolour
        // the panel and flip its light/dark variant. They are sandboxed
        // `allow-scripts` without `allow-same-origin`, so their opaque origin
        // serialises to the literal string "null" — and no host delivery can
        // have that origin, since the webview host document is served from a
        // real `vscode-webview:` one.
        //
        // Checked by ORIGIN rather than by `e.source`, because what `e.source`
        // is for a host delivery is an internal of the webview implementation
        // and a guard built on that fails silently on the version that changes
        // it. And applied HERE rather than above `goto`: navigation has been
        // watched working in a real host and the theme has not, so the cost of
        // being wrong about "null" is a colour that does not arrive, never a
        // sidebar click that stops moving the panel. `goto` keeps the src-prefix
        // pin it was already hardened with, which is what confines the same
        // grandchild there.
        const fromHost = e.origin !== 'null';
        // The sidebar's + button. Guarded like the theme branches and for a
        // sharper reason: this one draws a MODAL over the board, so an
        // agent-authored `html` widget reaching `window.top` could otherwise pop
        // the new-tab sheet whenever it liked. The board checks the sender too —
        // it only accepts `newtab` from its own parent, which is this page — so
        // the widget is refused at both ends.
        if (fromHost && e.data && e.data.type === 'newtab') {
          if (frame.contentWindow) {
            frame.contentWindow.postMessage({ __aboard: 'newtab' }, '*');
          }
          return;
        }
        if (fromHost && e.data && e.data.type === 'theme' && e.data.tokens) {
          theme = e.data;
          paint();
          return;
        }
        if (fromHost && e.data && e.data.type === 'theme-probe') {
          report();
        }
      });

      report();
      vscode.postMessage({ type: 'ready' });
    </script>
  </body>
</html>
